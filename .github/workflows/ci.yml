name: Central CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

concurrency:
  group: central-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Laravel tests (PHP 8.4)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, sqlite3, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: ${{ runner.os }}-php84-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php84-composer-

      - name: Validate Composer files
        run: composer validate --no-check-publish

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Check changed application PHP syntax
        run: |
          find app database/migrations tests -name '*.php' -print0 \
            | xargs -0 -n1 php -l >/tmp/php-lint.log
          tail -n 20 /tmp/php-lint.log

      - name: Run test suite
        run: php artisan test


  mariadb:
    name: MariaDB compatibility (11.4)
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: central_test
      DB_USERNAME: central
      DB_PASSWORD: central_test_password
      CACHE_STORE: file
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array

    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: central_test
          MARIADB_USER: central
          MARIADB_PASSWORD: central_test_password
          MARIADB_ROOT_PASSWORD: central_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: ${{ runner.os }}-php84-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php84-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare MariaDB test environment
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan migrate:fresh --force

      - name: Verify MariaDB driver
        run: |
          php artisan tinker --execute="if (DB::connection()->getDriverName() !== 'mysql') { throw new RuntimeException('MariaDB CI no está usando el driver mysql.'); } echo DB::selectOne('select version() as version')->version.PHP_EOL;"

      - name: Verify connection observability
        run: |
          php artisan central:db-health | tee /tmp/central-db-health.txt
          grep -q 'Conexiones actuales:' /tmp/central-db-health.txt
          grep -q 'Máximo observado:' /tmp/central-db-health.txt

      - name: Run critical MariaDB tests
        run: |
          php artisan test             tests/Feature/FrontWriteAuthorizationTest.php             tests/Feature/SharedClientOrganizationTest.php             tests/Feature/RecurringTaskGenerationTest.php             tests/Feature/TaskConversionHardeningTest.php             tests/Feature/QuickCaptureTest.php             tests/Feature/SafetyRecoveryTest.php


  e2e:
    name: Browser E2E (Playwright)
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_ENV: testing
      APP_URL: http://127.0.0.1:8000
      DB_CONNECTION: sqlite
      DB_DATABASE: /tmp/central-e2e.sqlite
      CACHE_STORE: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      E2E_BASE_URL: http://127.0.0.1:8000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, sqlite3, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install browser dependencies
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Prepare E2E application
        run: |
          cp .env.example .env
          php artisan key:generate
          touch /tmp/central-e2e.sqlite
          php artisan migrate --force
          php artisan db:seed --class='Database\Seeders\E2ETestSeeder' --force

      - name: Run browser journeys
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
