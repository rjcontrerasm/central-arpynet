name: Central CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

concurrency:
  group: central-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Laravel tests (PHP 8.4)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, sqlite3, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: ${{ runner.os }}-php84-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php84-composer-

      - name: Validate Composer files
        run: composer validate --no-check-publish

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Check changed application PHP syntax
        run: |
          find app database/migrations tests -name '*.php' -print0 \
            | xargs -0 -n1 php -l >/tmp/php-lint.log
          tail -n 20 /tmp/php-lint.log

      - name: Run test suite
        run: php artisan test
