name: 2.26.1 one-shot FRONT navigation patch

on:
  push:
    branches:
      - feature/2.26.1-front-consistency

permissions:
  contents: write

jobs:
  patch-front-navigation:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/2.26.1-front-consistency
          fetch-depth: 0

      - name: Replace legacy admin resource links
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('resources/views/daily-ops.blade.php')
          text = path.read_text()

          replacements = [
              (r'''href="\{\{ url\('/admin/tareas'\) \}\}"''', '''href="{{ route('global-tracking.show') }}"''', 1),
              (r'''href="\{\{ url\(\s*'/admin/tareas-recurrentes',?\s*\) \}\}"''', '''href="{{ route('recurring-task-front.index') }}"''', 1),
              (r'''href="\{\{ url\('/admin/ordenes-servicio'\) \}\}"''', '''href="{{ route('service-orders-ops.show') }}"''', 2),
              (r'''href="\{\{ url\('/admin/vencimientos'\) \}\}"''', '''href="{{ route('obligation-ops.show') }}"''', 1),
              (r'''href="\{\{ url\('/admin/incidentes'\) \}\}"''', '''href="{{ route('incident-360.index') }}"''', 2),
          ]

          for pattern, replacement, expected in replacements:
              text, count = re.subn(pattern, replacement, text)
              if count != expected:
                  raise SystemExit(
                      f'Unexpected replacement count for {pattern}: {count} != {expected}'
                  )

          if '/admin/' in text:
              raise SystemExit('daily-ops.blade.php still contains /admin/ resource links')

          path.write_text(text)
          PY

      - name: Remove one-shot workflow and commit patch
        shell: bash
        run: |
          rm .github/workflows/patch-2.26.1-front-navigation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/views/daily-ops.blade.php .github/workflows/patch-2.26.1-front-navigation.yml
          git diff --cached --check
          git commit -m "2.26.1 — keep Mi día on FRONT routes"
          git push origin HEAD:feature/2.26.1-front-consistency
